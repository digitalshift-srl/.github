# Reusable: upload the built dist/ (artifact from ci.yml) to Cloudflare Workers (static assets) as a
# preview version with a stable alias per PR, then post or update one comment on the PR with the URL:
#   https://pr-<number>-<worker>.<account subdomain>.workers.dev
# A preview never changes the live site. If the Worker doesn't exist yet (new client, not launched),
# it is first created with a noindex "coming soon" placeholder, so previews work before launch.
# Previews should sit behind Cloudflare Access (README step 6b); a public one gets a warning.
name: preview
on:
  workflow_call:
    inputs:
      worker-name:
        description: Worker name. Defaults to the repo name.
        type: string
        default: ''
      wrangler-version:
        type: string
        default: '4.160.0'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      RESEND_API_KEY:
        required: false
      TURNSTILE_SECRET_KEY:
        required: false
      ZOHO_CLIENT_ID:
        required: false
      ZOHO_CLIENT_SECRET:
        required: false
      ZOHO_REFRESH_TOKEN:
        required: false
    outputs:
      url:
        description: Preview URL, empty if skipped
        value: ${{ jobs.deploy.outputs.url }}
permissions:
  contents: read
jobs:
  deploy:
    name: Preview on Cloudflare
    # Fork PRs get no secrets; previews are for our own branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.upload.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx -y wrangler@${{ inputs.wrangler-version }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - id: setup
        env:
          NAME: ${{ inputs.worker-name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::notice::Cloudflare secrets not set: preview skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Worker names: lowercase letters, digits, dashes. Leave room for the "pr-NNNN-" alias (63-char DNS label).
          name=$(printf '%s' "${NAME:-${GITHUB_REPOSITORY#*/}}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -E 's/^-+//; s/-+$//' | cut -c1-50)
          { echo "enabled=true"; echo "name=$name"; echo "alias=pr-$PR"; } >> "$GITHUB_OUTPUT"

      - if: steps.setup.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - if: steps.setup.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Default wrangler.jsonc if the repo has none
        if: steps.setup.outputs.enabled == 'true'
        run: |
          [[ -f wrangler.jsonc ]] && exit 0
          cat > wrangler.jsonc <<'EOF'
          {
            "name": "site",
            "compatibility_date": "2026-11-01",
            "assets": { "directory": "./dist", "not_found_handling": "404-page", "html_handling": "auto-trailing-slash" },
            "workers_dev": true,
            "preview_urls": true
          }
          EOF

      - name: Create the Worker with a placeholder if it doesn't exist yet
        if: steps.setup.outputs.enabled == 'true'
        env:
          NAME: ${{ steps.setup.outputs.name }}
        run: |
          body=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$NAME/settings")
          code=$(tail -n1 <<<"$body")
          if [[ "$code" == "200" ]]; then exit 0; fi
          if [[ "$code" != "404" ]]; then
            msg=$(sed '$d' <<<"$body" | jq -r '[.errors[]?.message] | join("; ")' 2>/dev/null || true)
            echo "::error::Cloudflare API $code checking Worker $NAME: ${msg:-no message}. Check CLOUDFLARE_API_TOKEN (Account → Workers Scripts → Edit) and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          echo "::notice::Worker $NAME doesn't exist yet: creating it with a placeholder page (not indexed)."
          mkdir -p "$RUNNER_TEMP/placeholder"
          cat > "$RUNNER_TEMP/placeholder/index.html" <<'EOF'
          <!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <meta name="viewport" content="width=device-width,initial-scale=1"><title>In costruzione</title></head>
          <body style="font-family:system-ui;display:grid;place-items:center;min-height:100vh;margin:0">
          <p>Sito in costruzione.</p></body></html>
          EOF
          # From an empty folder, so the repo's wrangler.jsonc (and its Worker code) isn't used for the placeholder.
          (cd "$RUNNER_TEMP" && $WRANGLER deploy --name "$NAME" --assets placeholder --compatibility-date 2026-11-01)

      - id: upload
        name: Upload preview version
        if: steps.setup.outputs.enabled == 'true'
        env:
          NAME: ${{ steps.setup.outputs.name }}
          ALIAS: ${{ steps.setup.outputs.alias }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          # Contact form secrets (Resend, Turnstile, Zoho) for the Worker (worker/), uploaded with the version. Only when the repo has a Worker.
          secrets_args=()
          if grep -q '"main"' wrangler.jsonc; then
            install -m 600 /dev/null "$RUNNER_TEMP/secrets.json"
            jq -n 'env | {RESEND_API_KEY, TURNSTILE_SECRET_KEY, ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET, ZOHO_REFRESH_TOKEN}
              | with_entries(select(.value != null and .value != ""))' > "$RUNNER_TEMP/secrets.json"
            secrets_args=(--secrets-file "$RUNNER_TEMP/secrets.json")
            trap 'rm -f "$RUNNER_TEMP/secrets.json"' EXIT
          fi
          $WRANGLER versions upload --name "$NAME" --preview-alias "$ALIAS" --tag "${SHA:0:7}" --message "PR preview ${SHA:0:7}" "${secrets_args[@]}"
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          [[ -n "$sub" ]] || { echo "::error::No workers.dev subdomain on this account. Open Workers & Pages in the dashboard once."; exit 1; }
          echo "url=https://$ALIAS-$NAME.$sub.workers.dev" >> "$GITHUB_OUTPUT"

      - id: access
        name: Check the preview is behind Cloudflare Access
        if: steps.upload.outputs.url != ''
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          # Access answers with a redirect to <team>.cloudflareaccess.com (or 401/403), never the page itself.
          read -r code location < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "$URL" || echo "000 -")
          if [[ "$code" =~ ^(401|403)$ || "$location" == *cloudflareaccess.com* ]]; then
            echo "public=false" >> "$GITHUB_OUTPUT"
          else
            echo "public=true" >> "$GITHUB_OUTPUT"
            echo "::warning::The preview is public (HTTP $code): anyone with the link can open it. Turn on Cloudflare Access for this Worker's Preview URLs (README step 6b)."
          fi

      - name: Comment the preview URL on the PR
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.upload.outputs.url }}
          PUBLIC: ${{ steps.access.outputs.public }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- digitalshift-preview -->';
            const access = process.env.PUBLIC === 'true'
              ? '⚠️ **Public:** anyone with the link can open it. Turn on Cloudflare Access for this Worker (Settings → Domains & Routes → Preview URLs).'
              : '🔒 Sign-in required (Cloudflare Access).';
            const body = `${marker}\n🔍 **Preview:** ${process.env.URL}\n\n${access}\n\nCommit \`${process.env.SHA.slice(0, 7)}\`. Updates on every push.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
