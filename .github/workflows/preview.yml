# Reusable: upload the built dist/ (artifact from ci.yml) to Cloudflare Pages as a branch preview,
# then post or update one comment on the PR with the URL.
# Direct upload from Actions doesn't use the Pages build quota.
name: preview
on:
  workflow_call:
    inputs:
      cloudflare-project:
        description: Pages project name. Defaults to the repo name.
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      url:
        description: Preview URL (branch alias when available), empty if skipped
        value: ${{ jobs.deploy.outputs.url }}
permissions:
  contents: read
jobs:
  deploy:
    name: Preview on Cloudflare Pages
    # Fork PRs get no secrets; previews are for our own branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - id: setup
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.cloudflare-project }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ -z "$TOKEN" || -z "$ACCOUNT" ]]; then
            echo "::notice::Cloudflare secrets not set: preview skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "project=${PROJECT:-${GITHUB_REPOSITORY#*/}}" >> "$GITHUB_OUTPUT"
          # Branch names go into a command line: keep only safe characters.
          branch=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9-' '-' | cut -c1-28 | sed 's/-*$//')
          echo "branch=${branch:-preview}" >> "$GITHUB_OUTPUT"

      - if: steps.setup.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - id: wrangler
        if: steps.setup.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ steps.setup.outputs.project }} --branch=${{ steps.setup.outputs.branch }} --commit-hash=${{ github.event.pull_request.head.sha }}

      - id: url
        if: steps.setup.outputs.enabled == 'true'
        env:
          ALIAS: ${{ steps.wrangler.outputs.pages-deployment-alias-url }}
          DEPLOY: ${{ steps.wrangler.outputs.deployment-url }}
        run: echo "url=${ALIAS:-$DEPLOY}" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL on the PR
        if: steps.url.outputs.url != ''
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.url.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- digitalshift-preview -->';
            const body = `${marker}\n🔍 **Preview:** ${process.env.URL}\n\nCommit \`${process.env.SHA.slice(0, 7)}\`. Updates on every push.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
